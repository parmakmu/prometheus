# Python dependencies of the skill scripts. `uv sync` creates .venv/, which the
# extensions use (override with PI_WORKFLOW_PYTHON).
[project]
name = "prometheus"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["typer>=0.12", "pydantic>=2.7", "pydantic-settings>=2.4", "python-dotenv>=1.0", "ruamel.yaml>=0.18"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# all cores; tests marked xdist_group (a shared scenario or module fixture) stay together on one worker
addopts = "-n auto --dist loadgroup"
