# prometheus as a package: `uv tool install git+<repo>` gives the `prometheus` command (prometheus/cli.py), with
# the skill scripts' dependencies. In a clone, `uv sync` creates .venv/, which the extensions use (override with
# PI_AGENT_PYTHON; the `prometheus` command sets it to its own Python).
[project]
name = "prometheus"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["typer>=0.12", "rich>=13", "pydantic>=2.7", "pydantic-settings>=2.4", "python-dotenv>=1.0", "ruamel.yaml>=0.18",
                "packaging>=24", "psutil>=6",
                "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]  # the last three: `prometheus serve`

[project.scripts]
prometheus = "prometheus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# the wheel keeps the repo's layout under prometheus/ (cli.py finds .pi/ beside it, the skill finds templates/ two
# folders up), leaving out what is per machine (sessions) or not needed to run (tests, docs, ui)
[tool.hatch.build.targets.wheel]
packages = ["prometheus"]

[tool.hatch.build.targets.wheel.force-include]
".pi/APPEND_SYSTEM.md" = "prometheus/.pi/APPEND_SYSTEM.md"
".pi/settings.json" = "prometheus/.pi/settings.json"
".pi/agents" = "prometheus/.pi/agents"
".pi/extensions/prometheus" = "prometheus/.pi/extensions/prometheus"
".pi/skills/agent" = "prometheus/.pi/skills/agent"
"templates" = "prometheus/templates"
"catalog.yaml" = "prometheus/catalog.yaml"

[dependency-groups]
dev = [
    "httpx>=0.27",  # FastAPI's test client
    "pytest>=8.3",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# all cores; tests marked xdist_group (a shared scenario or module fixture) stay together on one worker
addopts = "-n auto --dist loadgroup"
