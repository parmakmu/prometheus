# ── Plan for agent "competitor-memo"
# Example: an abstract request where the planner has nothing to look at.
# Wave 1 discovers; the plan resolves before the analysis is detailed.
# In an agent this folder is agents/competitor-memo/plan.yaml (and .plan/).

format: 1
revision: 1
status: ready

# ── What you asked for ──────────────────────────────────────────────────────
request: >-
  Look at our main competitors, figure out how they position themselves, and
  draft a positioning memo for us. Put it on our strategy page in Notion.

goal: >-
  A sourced positioning memo that compares our main competitors' positioning
  with ours, published as a new page under the strategy page in Notion.

done_when:
  - the user confirmed which competitors the memo covers
  - every confirmed competitor has a positioning profile with at least two sources
  - the memo compares their positioning with ours and recommends where we stand apart
  - >-
    the memo is a new child page under the strategy page; no existing Notion
    page changed

# ── What it works on ────────────────────────────────────────────────────────
params:
  product_brief:
    description: a short description of our product and customers (md or txt)
  notion_parent:
    description: URL or id of the Notion strategy page the memo goes under
    type: text
  notion_token:
    description: token of the Notion integration the publishing stage's Notion tools use
    type: secret
    env: NOTION_TOKEN

inputs:
  - id: brief
    kind: file
    path: ${product_brief}
    format: md
    access: read

outputs:
  - id: notion_memo
    kind: app
    path: ${notion_parent}
    format: notion page
    overwrite: false

# ── How it works ────────────────────────────────────────────────────────────
stages:
  - id: discover
    title: Find the main competitors and their positioning sources
    kind:
      value: judgment
      reason: which companies count as main competitors is a judgment of market overlap
    pattern: worker
    agent: researcher
    reads: [brief]
    writes:
      - id: competitor_list
        path: competitors.json
        format: json
        schema: {name: string, url: string, why_competitor: string, positioning_sources: [string]}
    review: evidence-auditor
    done_when: 4-8 competitors, each with at least two public positioning sources

  - id: confirm-list
    title: User confirms which competitors to cover
    kind:
      value: decision
      reason: the scope of the memo is the user's call
    pattern: approval
    after: [discover]
    reads: [competitor_list]
    writes:
      - id: confirmed_list
        path: decisions/confirmed-competitors.json
        format: json

  - id: analyse
    resolves_after: discover
    title: Profile each confirmed competitor's positioning
    kind:
      value: judgment
      reason: reading messaging, audience and proof points needs judgment
    intent: >-
      one positioning profile per confirmed competitor (claim, audience, pricing
      model, proof points), each with sources
    after: [confirm-list]
    reads: [confirmed_list, competitor_list]
    writes:
      - id: profiles

  - id: memo
    title: Draft the positioning memo
    kind:
      value: judgment
      reason: comparing positions and recommending ours is argument, not computation
    pattern: worker
    agent: reader
    after: [analyse]
    reads: [profiles, brief]
    writes:
      - id: memo_draft
        path: memo.md
        format: md

  - id: review-memo
    title: Check the memo's claims against the profiles and sources
    kind:
      value: judgment
      reason: whether a claim is supported needs reading the sources
    pattern: reviewer
    agent: reviewer
    after: [memo]
    reads: [memo_draft, profiles]
    writes:
      - id: memo_review
        path: memo-review.json
        format: json
        schema: {blocking: boolean, unsupported_claims: [string], notes: [string]}

  - id: publish
    title: Create the memo as a new child page in Notion
    kind:
      value: side_effect
      reason: writes to the user's Notion workspace
    pattern: worker
    agent: worker
    after: [review-memo]
    reads: [memo_draft, memo_review]
    writes:
      - id: notion_memo
        format: notion page
    done_when: a new page exists under the parent with the memo's title; no other page changed

# ── Assumptions ─────────────────────────────────────────────────────────────
assumptions:
  - id: a1
    text: the memo is at most two pages and written in English
    source: default
    confirm: true
  - id: a2
    text: public sources only (websites, pricing pages, press, reviews); no paid databases
    source: default
    confirm: true

# ── Limits and models ───────────────────────────────────────────────────────
limits:
  max_parallel: 4
  max_retries: 2
  max_batch: 20
