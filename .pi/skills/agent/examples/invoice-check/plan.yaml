# ── Plan for agent "invoice-check"
# Example: a plan that is concrete from the start. In an agent this folder is
# agents/invoice-check/plan.yaml (and .plan/), with gates/check_lines.py and
# gates/check_report.py written during planning.

version: 1
revision: 1
status: ready

# ── What you asked for ──────────────────────────────────────────────────────
request: >-
  Go through the supplier folder in my mail export, find the invoices, check
  them against the Q3 budget sheet, flag anything over budget and draft
  replies to suppliers where the amounts don't match the PO.

goal: >-
  A variance report of Q3 supplier invoices against budget, plus reply drafts
  for invoices whose amounts differ from their purchase order.

done_when:
  - every invoice found in the folder appears once in the variance report
  - each report row shows invoice amount, PO amount, budget line and status
  - one reply draft exists for each invoice with status "po_mismatch"
  - nothing is sent

# ── What it works on ────────────────────────────────────────────────────────
params:
  mail_dir:
    description: folder with the supplier mail export (.eml files)
  budget_file:
    description: the Q3 budget workbook
  report_dir:
    description: folder for the final variance report
    default: outputs

inputs:
  - id: mail
    kind: folder
    location: ${mail_dir}
    format: eml
    access: read
    note: 1,240 .eml files observed; about 300 have PDF attachments
  - id: budget
    kind: file
    location: ${budget_file}
    format: xlsx
    access: read
    note: sheet "Q3" with columns cost_center, supplier, po_number, po_amount, budget

outputs:
  - id: variance_report
    kind: file
    location: ${report_dir}/Q3-invoice-variance.xlsx
    format: xlsx
    overwrite: false
  - id: reply_drafts
    kind: app
    location: Gmail drafts
    format: email

# ── How it works ────────────────────────────────────────────────────────────
stages:
  - key: find
    title: Classify which emails carry supplier invoices
    kind: judgment
    kind_reason: forwarded and inline invoices defeat sender or attachment rules
    pattern: map
    agent: reader               # reads the emails: no shell, so text in them can't run commands
    consumes: [mail]
    items: mail
    items_glob: "*.eml"
    batch: 50
    out:
      - id: invoice_index
        path: invoice-index.json
        format: json
        schema: {file: string, is_invoice: boolean, supplier: string, attachment: string}
    verify:
      check: every file in the folder is classified exactly once

  - key: extract
    title: Pull invoice number, PO number, date and amount from text-layer PDFs
    kind: deterministic
    kind_reason: fixed fields in machine-generated PDFs; checkable by recount
    pattern: script
    agent: worker
    script: extract_invoice_lines.py
    run: "${mail_dir} invoice-index.json invoice-lines.csv unparsed.json"
    needs: [find]
    consumes: [mail, invoice_index]
    out:
      - id: invoice_lines
        path: invoice-lines.csv
        format: csv
      - id: unparsed
        path: unparsed.json
        format: json
        notes: invoices the parser could not read, with a reason each
    verify:
      gate:
        command: python3 ../gates/check_lines.py invoice-lines.csv unparsed.json invoice-index.json
        output: json
      check: parsed rows plus unparsed entries equal the invoice count

  - key: extract-rest
    title: Read the invoices the parser could not
    kind: judgment
    kind_reason: scans and odd layouts need reading, not parsing
    pattern: map
    agent: reader
    needs: [extract]
    consumes: [mail, unparsed]
    items: unparsed
    batch: 10
    out:
      - id: rest_lines
        path: rest-lines.json
        format: json
        schema: {invoice_no: string, po_number: string, date: string, amount: number, supplier: string, confidence: string}

  - key: compare
    title: Join invoices to budget and PO amounts, compute status
    kind: deterministic
    kind_reason: exact join on PO number and arithmetic against the budget sheet
    pattern: script
    agent: worker
    script: compare_to_budget.py
    run: "${budget_file} invoice-lines.csv rest-lines.json ${report_dir}/Q3-invoice-variance.xlsx"
    needs: [extract-rest]
    consumes: [invoice_lines, rest_lines, budget]
    out:
      - id: variance_report
        path: ${report_dir}/Q3-invoice-variance.xlsx
        format: xlsx
    verify:
      gate: python3 ../gates/check_report.py ${report_dir}/Q3-invoice-variance.xlsx
      check: row count equals invoice count; status in {ok, over_budget, po_mismatch, no_po}

  - key: review
    title: Spot-check mismatches, over-budget rows and low-confidence reads
    kind: judgment
    kind_reason: whether a flagged row is a real discrepancy needs reading the invoice
    pattern: reviewer
    agent: reviewer
    needs: [compare]
    consumes: [variance_report, invoice_lines, rest_lines]
    out:
      - id: review_notes
        path: review.json
        format: json
        schema: {blocking: boolean, findings: [string]}

  - key: approve-drafts
    title: User reviews the report and approves drafting
    kind: decision
    kind_reason: whether to contact suppliers is the user's call
    pattern: approval
    needs: [review]
    consumes: [variance_report, review_notes]
    out:
      - id: draft_approval
        format: text

  - key: drafts
    title: Draft one reply per po_mismatch invoice in Gmail
    kind: side_effect
    kind_reason: creates drafts in the user's Gmail account
    pattern: worker
    agent: worker
    needs: [approve-drafts]
    consumes: [variance_report, draft_approval]
    approval: required
    out:
      - id: reply_drafts
        format: email
    verify:
      check: draft count equals number of po_mismatch rows; none sent

# ── Assumptions ─────────────────────────────────────────────────────────────
assumptions:
  - id: a1
    text: >-
      Most invoices are PDF attachments with a text layer; the rest go through
      extract-rest
    source: observed
    confirm: false
  - id: a2
    text: >-
      Report columns are invoice_no, supplier, date, amount, po_number, po_amount,
      budget_line, budget_remaining, status
    source: default
    confirm: true

# ── Limits and models ───────────────────────────────────────────────────────
limits:
  max_parallel: 4
  max_retries: 2
  max_batch: 50
